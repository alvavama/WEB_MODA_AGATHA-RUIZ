<!DOCTYPE html>

<html lang="es">
    <head>
        <title>Entradas</title>
        <meta charset="utf-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&display=swap" rel="stylesheet">
        
        <link href="css/styles.css" rel="stylesheet" type="text/css">
        <script src="js/script.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    
    <body>
        <div class="merchheader">
            <div class="merchenlace">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <p>AGATHA RUIZ DE LA PRADA</p>
            </div>
            <div><p>MERCH</p></div>
        </div>

        <section class="formulario">
            <div class="textoyfoto">
                <h1>COMPRA TU ENTRADA</h1>
                <img src="img/corazoncin.png"> 
            </div>
            
            <form onsubmit="return comprar()">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre" required>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" placeholder="Escribe tu correo" required>
                <label for="exposicion">Exposición:</label>
               
                <select id="exposicion" onchange="costeTotal()">
                    <option value="e1">Entrada General - 80 €</option>
                    <option value="e2">Entrada Front row - 110 €</option>
                    <option value="e3">Entrada Vip - 150 €</option>
                </select>
                <label for="numero">Número de entradas:</label>
                
                <input type="number" id="numero" min="1" max="10" placeholder="Número de entradas" required onchange="costeTotal()">
                <p>Coste total: <span id="coste"></span></p>
                <input type="submit" value="Comprar entradas">
            </form>
        </section>

        <div class="tickets">
            <img class="general" src="img/general.jpg">
            <img class="frontrow" src="img/frontrow.jpg">
            <img class="vip" src="img/vip.jpg">
        </div>


        
        <div id="modal">
            <div>
                <h2>La compra se ha realizado correctamente</h2>
                <ul>
                    <li>Nombre: <span id="nom"></span></li>
                    <li>Correo electrónico: <span id="corr"></span></li>
                    <li>Exposición: <span id="ex"></span></li>
                    <li>Número de entradas: <span id="num"></span></li>
                    <li>Coste total: <span id="ct"></span></li>
                </ul>
                <button onclick="cerrarVentana()">Aceptar</button>
            </div>
        </div>
    </body>
</html>
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entradas</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="javascript/script.js"></script>
  </head>
  <body></body>
</html>
